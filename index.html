<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live-сканер LEGO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .camera-box {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reticle {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 2px dashed rgba(255, 215, 0, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: border-color 0.2s ease;
    }
    .reticle.waiting-swap {
      border-color: rgba(142, 142, 147, 0.85);
    }
    .badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(48, 209, 88, 0.9);
      color: #000;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .hybrid-progress-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      display: none;
    }
    .hybrid-progress-bar {
      height: 100%;
      width: 0%;
      background: #30d158;
      transition: width 0.1s linear;
    }
    .panel {
      background: #1c1c1e;
      padding: 16px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-card {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .part-num {
      font-size: 20px;
      font-weight: 800;
      color: #ffd60a;
    }
    .part-name {
      font-size: 15px;
      color: #f2f2f7;
      line-height: 1.3;
    }
    .part-color {
      font-size: 14px;
      color: #32d74b;
      font-weight: 600;
    }
    .status-text {
      color: #8e8e93;
      font-size: 14px;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #scanBtn {
      background: #0a84ff;
      color: #fff;
    }
    #scanBtn:disabled {
      background: #3a3a3c;
      color: #8e8e93;
    }
    #autoBtn {
      background: #2c2c2e;
      color: #fff;
      flex: 0.85;
      font-size: 14px;
    }
    #autoBtn.active {
      background: #30d158;
      color: #000;
    }
    #autoBtn.waiting {
      background: #ffd60a;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="camera-box">
    <span class="badge" id="modeBadge">Гибридный режим склада</span>
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle" id="reticle"></div>
    <div class="hybrid-progress-wrap" id="progressWrap">
      <div class="hybrid-progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="panel">
    <div class="result-card" id="resultCard">
      <div class="status-text">Наведите прицел на деталь и нажмите «Распознать» или включите «Гибрид»</div>
    </div>

    <div class="controls">
      <button id="scanBtn">📷 Распознать</button>
      <button id="autoBtn">🔄 Гибрид: ВЫКЛ</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>
  <canvas id="diffCanvas" width="32" height="32" style="display:none;"></canvas>

  <script>
    const EDGE_FUNCTION_URL = "https://zpjmccnrfarkmmzvzbfj.supabase.co/functions/v1/telegram-bot";
    const IS_CLIENT_MODE = new URLSearchParams(window.location.search).get("mode") === "client";
    const HYBRID_DELAY_MS = 3500; // Задержка 3,5 секунды в гибридном режиме

    const modeBadge = document.getElementById("modeBadge");
    if (IS_CLIENT_MODE && modeBadge) {
      modeBadge.textContent = "Поиск по каталогу";
      modeBadge.style.background = "rgba(10, 132, 255, 0.92)";
      modeBadge.style.color = "#fff";
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const diffCanvas = document.getElementById("diffCanvas");
    const reticle = document.getElementById("reticle");
    const resultCard = document.getElementById("resultCard");
    const scanBtn = document.getElementById("scanBtn");
    const autoBtn = document.getElementById("autoBtn");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");

    let isScanning = false;
    let isHybridActive = false;
    let wasAutoPaused = false;
    let hybridTimeout = null;
    let countdownInterval = null;
    let swapPollInterval = null;

    // Защита от повторного сканирования той же неподвижной детали
    let requireSceneChange = false;
    let lastFrameSignature = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" }, 
            width: { ideal: 1280 }, 
            height: { ideal: 720 } 
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: false 
          });
          video.srcObject = fallbackStream;
          await video.play();
        } catch (e) {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка доступа к камере: ${e.message}</div>`;
        }
      }
    }

    function captureCenterCrop() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cropSize = Math.min(vw, vh) * 0.65;
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;

      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 512, 512);

      return canvas.toDataURL("image/jpeg", 0.82);
    }

    // Снимаем компактный слепок центра кадра (32x32) для определения смены детали
    function getFrameSignature() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cropSize = Math.min(vw, vh) * 0.65;
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;

      const dCtx = diffCanvas.getContext("2d", { willReadFrequently: true });
      dCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 32, 32);
      return dCtx.getImageData(0, 0, 32, 32).data;
    }

    // Вычисляем среднюю разницу яркости пикселей между двумя кадрами (0..255)
    function computeFrameDiff(sigA, sigB) {
      if (!sigA || !sigB || sigA.length !== sigB.length) return 255;
      let totalDiff = 0;
      const pixels = sigA.length / 4;
      for (let i = 0; i < sigA.length; i += 4) {
        const dR = Math.abs(sigA[i] - sigB[i]);
        const dG = Math.abs(sigA[i + 1] - sigB[i + 1]);
        const dB = Math.abs(sigA[i + 2] - sigB[i + 2]);
        totalDiff += (dR + dG + dB) / 3;
      }
      return totalDiff / pixels;
    }

    function resolveUserId() {
      const fromTg = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      const fromUrl = new URLSearchParams(window.location.search).get("uid");
      const candidate = fromTg || fromUrl;

      if (candidate && candidate !== "undefined" && candidate !== "null") {
        try {
          localStorage.setItem("lego_scanner_uid", String(candidate));
        } catch (e) {}
        return String(candidate);
      }

      try {
        const saved = localStorage.getItem("lego_scanner_uid");
        if (saved && saved !== "undefined" && saved !== "null") {
          return saved;
        }
      } catch (e) {}

      return null;
    }

    let userId = resolveUserId();

    function clearHybridTimers() {
      if (hybridTimeout) {
        clearTimeout(hybridTimeout);
        hybridTimeout = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      if (swapPollInterval) {
        clearInterval(swapPollInterval);
        swapPollInterval = null;
      }
      progressWrap.style.display = "none";
      progressBar.style.width = "0%";
      reticle.classList.remove("waiting-swap");
    }

    function stopHybridMode() {
      isHybridActive = false;
      wasAutoPaused = false;
      clearHybridTimers();
      autoBtn.classList.remove("active", "waiting");
      autoBtn.textContent = "🔄 Гибрид: ВЫКЛ";
    }

    function scheduleNextHybridCycle(delayMs = HYBRID_DELAY_MS) {
      clearHybridTimers();
      if (!isHybridActive || wasAutoPaused) return;

      const startTime = Date.now();
      progressWrap.style.display = "block";
      progressBar.style.width = "100%";

      autoBtn.classList.remove("waiting");
      autoBtn.classList.add("active");
      autoBtn.textContent = `🟢 Гибрид: ${(delayMs / 1000).toFixed(1)}с`;

      countdownInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(0, delayMs - elapsed);
        const pct = (remaining / delayMs) * 100;
        progressBar.style.width = `${pct}%`;
        autoBtn.textContent = `🟢 Гибрид: ${(remaining / 1000).toFixed(1)}с`;
      }, 100);

      hybridTimeout = setTimeout(() => {
        clearHybridTimers();
        if (!isHybridActive || wasAutoPaused) return;

        // Если после прошлого +1 деталь ещё не убрали из прицела — ждём смены детали
        if (requireSceneChange && lastFrameSignature) {
          waitForPartSwap();
        } else {
          scanFrame(false);
        }
      }, delayMs);
    }

    function waitForPartSwap() {
      clearHybridTimers();
      if (!isHybridActive || wasAutoPaused) return;

      autoBtn.classList.remove("active");
      autoBtn.classList.add("waiting");
      autoBtn.textContent = "⏳ Смените деталь";
      reticle.classList.add("waiting-swap");

      let stableFramesAfterMove = 0;
      let prevCheckSig = getFrameSignature();
      let sceneChanged = false;

      swapPollInterval = setInterval(() => {
        if (!isHybridActive || wasAutoPaused || isScanning) return;

        const currentSig = getFrameSignature();
        if (!currentSig) return;

        // 1. Проверяем, сдвинули ли старую деталь (порог отличия > 14)
        if (!sceneChanged) {
          const diffFromLastScan = computeFrameDiff(lastFrameSignature, currentSig);
          if (diffFromLastScan > 14) {
            sceneChanged = true;
            autoBtn.textContent = "✋ Фиксирую...";
          }
          prevCheckSig = currentSig;
          return;
        }

        // 2. После смены ждём 2 спокойных замера (~0.5 сек), чтобы рука ушла из кадра
        const motionDiff = computeFrameDiff(prevCheckSig, currentSig);
        prevCheckSig = currentSig;

        if (motionDiff < 8) {
          stableFramesAfterMove++;
          if (stableFramesAfterMove >= 2) {
            clearHybridTimers();
            requireSceneChange = false;
            scanFrame(false);
          }
        } else {
          stableFramesAfterMove = 0;
        }
      }, 250);
    }

    function pauseAutoForChoice() {
      if (isHybridActive) {
        clearHybridTimers();
        wasAutoPaused = true;
        autoBtn.classList.remove("active", "waiting");
        autoBtn.textContent = "⏸ Пауза (выбор)";
      }
    }

    function resumeAutoIfNeeded() {
      if (wasAutoPaused) {
        wasAutoPaused = false;
        isHybridActive = true;
        scheduleNextHybridCycle(HYBRID_DELAY_MS);
      }
    }

    function renderAddedCard(data) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      }
      resultCard.innerHTML = `
        <div class="part-num">🔢 ${data.part_number} <span style="color:#30d158;">(+1 шт)</span></div>
        <div class="part-name">🧩 ${data.part_name}</div>
        <div class="part-color">🎨 Цвет: ${data.color_name}</div>
        <div class="part-stock" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c; font-size: 15px; color: #30d158; font-weight: 700;">
          📦 ${data.location}: ${data.new_stock} шт (${data.price} ₽)
        </div>
        <button onclick="undoScan(this, ${data.row_num})" style="margin-top: 10px; width: 100%; background: #ff453a; color: white; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none;">
          ❌ Ошибка (Отменить +1)
        </button>
      `;
    }

    function renderClientCard(data) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      }

      const items = Array.isArray(data.items) ? data.items : [];
      let stockBlockHtml = "";

      if (items.length === 0) {
        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c; font-size: 14px; color: #ff453a; font-weight: 600;">
            🔴 Нет в наличии в каталоге склада
          </div>
        `;
      } else if (items.length === 1) {
        const it = items[0];
        const inStock = it.stock > 0;
        const stockColor = inStock ? "#30d158" : "#ff453a";
        const stockLabel = inStock ? `В наличии: ${it.stock} шт.` : "Нет в наличии (0 шт.)";
        const commentHtml = it.comment
          ? `<div style="font-size: 12px; color: #d1d1d6; margin-top: 4px;">💬 ${it.comment}</div>`
          : "";

        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c;">
            <div style="font-size: 16px; font-weight: 800; color: #ffd60a;">
              💰 ${it.price} ₽ <span style="color: ${stockColor}; font-size: 14px; font-weight: 700;">• ${stockLabel}</span>
            </div>
            ${commentHtml}
          </div>
        `;
      } else {
        const rowsHtml = items.map(it => {
          const inStock = it.stock > 0;
          const stockColor = inStock ? "#30d158" : "#ff453a";
          const stockLabel = inStock ? `${it.stock} шт.` : "0 шт.";
          const commentBadge = it.comment ? ` • 💬 ${it.comment}` : "";
          return `
            <div style="background: #3a3a3c; padding: 8px 10px; border-radius: 8px; margin-top: 6px; font-size: 13px;">
              <span style="font-weight: 800; color: #ffd60a;">💰 ${it.price} ₽</span>
              <span style="color: ${stockColor}; font-weight: 700;"> • 📦 ${stockLabel}</span>
              <span style="color: #d1d1d6; font-size: 12px;">${commentBadge}</span>
            </div>
          `;
        }).join("");

        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c;">
            <div style="font-size: 12px; color: #8e8e93;">Найдено позиций: ${items.length}</div>
            ${rowsHtml}
          </div>
        `;
      }

      resultCard.innerHTML = `
        <div class="part-num">🔢 ${data.part_number}</div>
        <div class="part-name">🧩 ${data.part_name}</div>
        <div class="part-color">🎨 Цвет: ${data.color_name}</div>
        ${stockBlockHtml}
      `;
    }

    async function scanFrame(isManual = false) {
      if (isScanning) return;
      if (!isManual && wasAutoPaused) return;

      const base64Image = captureCenterCrop();
      if (!base64Image) return;

      const currentSig = getFrameSignature();

      userId = resolveUserId();
      if (!userId && !IS_CLIENT_MODE) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка: Не получен ID Telegram. Откройте сканер через бота.</div>`;
        return;
      }

      clearHybridTimers();
      isScanning = true;
      scanBtn.disabled = true;
      scanBtn.textContent = "⏳ Распознаю...";

      let needChoicePause = false;

      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "live_scan_add",
            image_base64: base64Image,
            user_id: userId || "guest",
            mode: IS_CLIENT_MODE ? "client" : "admin"
          })
        });

        const data = await res.json();

        if (data.success && data.mode === "client_info") {
          renderClientCard(data);
          lastFrameSignature = currentSig;
          requireSceneChange = true;
        } else if (data.success && data.mode === "choose") {
          needChoicePause = true;
          lastFrameSignature = currentSig;
          requireSceneChange = true;
          pauseAutoForChoice();
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred("warning");
          }

          const buttonsHtml = data.variants.map(v => {
            const commentBadge = v.comment ? ` • 💬 ${v.comment}` : " • Без пометки";
            return `
              <button onclick="confirmVariant(${v.row_num})" style="width: 100%; text-align: left; background: #3a3a3c; color: #fff; padding: 10px 12px; border-radius: 8px; margin-top: 6px; font-size: 13px; border: 1px solid #545458;">
                <div style="font-weight: 700; color: #ffd60a;">➕ ${v.price} ₽ (остаток: ${v.stock} шт.)</div>
                <div style="color: #d1d1d6; font-size: 12px; margin-top: 2px;">Строка №${v.row_num}${commentBadge}</div>
              </button>
            `;
          }).join("");

          resultCard.innerHTML = `
            <div style="background: rgba(255, 159, 10, 0.15); border: 1px solid #ff9f0a; border-radius: 10px; padding: 10px;">
              <div style="font-weight: 800; color: #ff9f0a; font-size: 14px;">⚠️ Найдено несколько вариантов (${data.part_number})</div>
              <div style="font-size: 12px; color: #e5e5ea; margin-top: 2px;">Выберите нужную строку для добавления +1 шт.:</div>
              ${buttonsHtml}
              <button onclick="cancelChoice()" style="width: 100%; background: transparent; color: #8e8e93; padding: 6px; margin-top: 6px; font-size: 12px; border: none;">
                Пропустить деталь
              </button>
            </div>
          `;
          } else if (data.success && data.mode === "not_found") {
          needChoicePause = true;
          lastFrameSignature = currentSig;
          requireSceneChange = true;
          pauseAutoForChoice();
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred("warning");
          }

          const refPriceHtml = data.ref_price_rub > 0
            ? `<div style="font-size: 13px; color: #ffd60a; margin-top: 4px;">💵 Ориентир BL (Used): <b>~${data.ref_price_rub} ₽</b></div>`
            : `<div style="font-size: 12px; color: #8e8e93; margin-top: 4px;">💵 Ориентир BL: нет данных</div>`;

          const safeNum = encodeURIComponent(data.part_number);
          const safeName = encodeURIComponent(data.part_name);
          const safeColor = encodeURIComponent(data.color_name);

          resultCard.innerHTML = `
            <div style="background: rgba(10, 132, 255, 0.14); border: 1px solid #0a84ff; border-radius: 10px; padding: 10px;">
              <div style="font-weight: 800; color: #64d2ff; font-size: 14px;">🆕 Нет на складе «${data.location}»</div>
              <div class="part-num" style="font-size: 17px; margin-top: 4px;">🔢 ${data.part_number}</div>
              <div class="part-name" style="font-size: 13px;">🧩 ${data.part_name}</div>
              <div class="part-color" style="font-size: 13px;">🎨 ${data.color_name}</div>
              ${refPriceHtml}
              <button onclick="createNewPartFromScan('${safeNum}', '${safeName}', '${safeColor}')" style="width: 100%; background: #30d158; color: #000; padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 14px; font-weight: 800; border: none;">
                ➕ Создать на складе (0 ₽, +1 шт.)
              </button>
              <button onclick="cancelChoice()" style="width: 100%; background: transparent; color: #8e8e93; padding: 6px; margin-top: 4px; font-size: 12px; border: none;">
                Пропустить деталь
              </button>
            </div>
          `;
        } else if (data.success && data.mode === "added") {
          renderAddedCard(data);
          lastFrameSignature = currentSig;
          requireSceneChange = true;
        } else {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">🤷‍♂️ ${data.error || "Не удалось распознать"}</div>`;
          requireSceneChange = false;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
        requireSceneChange = false;
      } finally {
        isScanning = false;
        scanBtn.disabled = false;
        scanBtn.textContent = "📷 Распознать";

        if (isHybridActive && !needChoicePause && !wasAutoPaused) {
          scheduleNextHybridCycle(HYBRID_DELAY_MS);
        }
      }
    }

    async function confirmVariant(rowNum) {
      resultCard.innerHTML = `<div class="status-text">⏳ Записываю +1 шт. в строку №${rowNum}...</div>`;
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "live_scan_confirm_row",
            row_num: rowNum
          })
        });
        const data = await res.json();
        if (data.success) {
          renderAddedCard(data);
          requireSceneChange = true;
          resumeAutoIfNeeded();
        } else {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">❌ ${data.error}</div>`;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
      }
    }
    async function createNewPartFromScan(encodedNum, encodedName, encodedColor) {
      const partNumber = decodeURIComponent(encodedNum);
      const partName = decodeURIComponent(encodedName);
      const colorName = decodeURIComponent(encodedColor);

      resultCard.innerHTML = `<div class="status-text">⏳ Создаю строку для ${partNumber}...</div>`;
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "live_scan_create_new",
            user_id: userId,
            part_number: partNumber,
            part_name: partName,
            color_name: colorName
          })
        });
        const data = await res.json();
        if (data.success) {
          renderAddedCard(data);
          requireSceneChange = true;
          resumeAutoIfNeeded();
        } else {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">❌ ${data.error || "Ошибка создания"}</div>`;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
      }
    }

    function cancelChoice() {
      resultCard.innerHTML = `<div class="status-text">Деталь пропущена. Сканируйте дальше.</div>`;
      requireSceneChange = true;
      resumeAutoIfNeeded();
    }

    async function undoScan(btn, rowNum) {
      btn.disabled = true;
      btn.textContent = "⏳ Отменяю...";
      requireSceneChange = true;
      if (isHybridActive) {
        scheduleNextHybridCycle(HYBRID_DELAY_MS);
      }
      try {
        await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "live_scan_undo", row_num: rowNum })
        });
        resultCard.innerHTML = `<div class="status-text" style="color:#ff9f0a;">↩️ Добавление отменено (-1 шт.).</div>`;
      } catch (err) {
        btn.textContent = "❌ Ошибка отмены";
      }
    }

    // Ручной спуск работает мгновенно даже при включённом гибридном режиме
    scanBtn.addEventListener("click", () => {
      wasAutoPaused = false;
      requireSceneChange = false;
      scanFrame(true);
    });

    // Переключение гибридного режима
    autoBtn.addEventListener("click", () => {
      if (isHybridActive || wasAutoPaused) {
        stopHybridMode();
      } else {
        isHybridActive = true;
        wasAutoPaused = false;
        requireSceneChange = false;
        scanFrame(false);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden && (isHybridActive || wasAutoPaused)) {
        stopHybridMode();
      }
    });

    startCamera();
  </script>
</body>
</html>
