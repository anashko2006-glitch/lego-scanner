<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Тест Live-сканера LEGO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .camera-box {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Прицел по центру экрана */
    .reticle {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 2px dashed rgba(255, 215, 0, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 193, 7, 0.9);
      color: #000;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .panel {
      background: #1c1c1e;
      padding: 16px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-card {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .part-num {
      font-size: 20px;
      font-weight: 800;
      color: #ffd60a;
    }
    .part-name {
      font-size: 15px;
      color: #f2f2f7;
      line-height: 1.3;
    }
    .part-color {
      font-size: 14px;
      color: #32d74b;
      font-weight: 600;
    }
    .status-text {
      color: #8e8e93;
      font-size: 14px;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #scanBtn {
      background: #0a84ff;
      color: #fff;
    }
    #scanBtn:disabled {
      background: #3a3a3c;
      color: #8e8e93;
    }
    #autoBtn {
      background: #2c2c2e;
      color: #fff;
      flex: 0.7;
      font-size: 14px;
    }
    #autoBtn.active {
      background: #30d158;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="camera-box">
    <span class="badge">Тестовый режим (без записи)</span>
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle"></div>
  </div>

  <div class="panel">
    <div class="result-card" id="resultCard">
      <div class="status-text">Наведите прицел на деталь и нажмите «Распознать»</div>
    </div>

    <div class="controls">
      <button id="scanBtn">📷 Распознать</button>
      <button id="autoBtn">🔄 Авто: ВЫКЛ</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // ⚠️ ВСТАВЬ СЮДА URL ТВОЕЙ EDGE FUNCTION В SUPABASE
    const EDGE_FUNCTION_URL = "https://zpjmccnrfarkmmzvzbfj.supabase.co/functions/v1/telegram-bot";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultCard = document.getElementById("resultCard");
    const scanBtn = document.getElementById("scanBtn");
    const autoBtn = document.getElementById("autoBtn");

    let isScanning = false;
    let autoTimer = null;

    // Запуск задней камеры телефона
    // Запуск задней камеры телефона с надёжным откатом
    async function startCamera() {
      try {
        // Сначала пробуем основную тыловую камеру (используем ideal, чтобы не падало на разных Android)
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" }, 
            width: { ideal: 1280 }, 
            height: { ideal: 720 } 
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        // Если возникла ошибка — включаем любую доступную камеру по умолчанию
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: false 
          });
          video.srcObject = fallbackStream;
          await video.play();
        } catch (e) {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка доступа к камере: ${e.message}</div>`;
        }
      }
    }

    // Вырезаем квадрат по центру прицела и сжимаем для быстрой отправки
    function captureCenterCrop() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cropSize = Math.min(vw, vh) * 0.65;
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;

      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 512, 512);

      return canvas.toDataURL("image/jpeg", 0.82);
    }

    async function scanFrame() {
      if (isScanning) return;
      const base64Image = captureCenterCrop();
      if (!base64Image) return;

      isScanning = true;
      scanBtn.disabled = true;
      scanBtn.textContent = "⏳ Распознаю...";

      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "test_live_scan",
            image_base64: base64Image
          })
        });

        const data = await res.json();

        if (data.success) {
          const confText = data.confidence ? ` (${data.confidence}%)` : "";
          // Выбираем цвет текста наличия: зелёный если есть, красный если нет
          const stockColor = data.stock_info.includes('Нет') ? '#ff453a' : '#30d158';
          
          resultCard.innerHTML = `
            <div class="part-num">🔢 ${data.part_number}${confText}</div>
            <div class="part-name">🧩 ${data.part_name}</div>
            <div class="part-color">🎨 Цвет: ${data.color_name}</div>
            <div class="part-stock" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #3a3a3c; font-size: 15px; color: ${stockColor}; font-weight: 700;">
              📦 ${data.stock_info}
            </div>
          `;
        } else {
          resultCard.innerHTML = `<div class="status-text">🤷‍♂️ ${data.error || "Не удалось распознать"}</div>`;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
      } finally {
        isScanning = false;
        scanBtn.disabled = false;
        scanBtn.textContent = "📷 Распознать";
      }
    }

    scanBtn.addEventListener("click", scanFrame);

    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.classList.remove("active");
        autoBtn.textContent = "🔄 Авто: ВЫКЛ";
      } else {
        autoBtn.classList.add("active");
        autoBtn.textContent = "🟢 Авто: ВКЛ";
        scanFrame();
        autoTimer = setInterval(scanFrame, 2500);
      }
    });

    startCamera();
  </script>
</body>
</html>
