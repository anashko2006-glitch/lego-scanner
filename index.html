<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live-сканер LEGO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .camera-box {
      position: relative;
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reticle {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 2px dashed rgba(255, 215, 0, 0.85);
      border-radius: 16px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .badge {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(48, 209, 88, 0.9);
      color: #000;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .panel {
      background: #1c1c1e;
      padding: 16px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .result-card {
      background: #2c2c2e;
      border-radius: 12px;
      padding: 14px;
      min-height: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    .part-num {
      font-size: 20px;
      font-weight: 800;
      color: #ffd60a;
    }
    .part-name {
      font-size: 15px;
      color: #f2f2f7;
      line-height: 1.3;
    }
    .part-color {
      font-size: 14px;
      color: #32d74b;
      font-weight: 600;
    }
    .status-text {
      color: #8e8e93;
      font-size: 14px;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #scanBtn {
      background: #0a84ff;
      color: #fff;
    }
    #scanBtn:disabled {
      background: #3a3a3c;
      color: #8e8e93;
    }
    #autoBtn {
      background: #2c2c2e;
      color: #fff;
      flex: 0.7;
      font-size: 14px;
    }
    #autoBtn.active {
      background: #30d158;
      color: #000;
    }
  </style>
</head>
<body>

  <div class="camera-box">
    <span class="badge" id="modeBadge">Боевой режим склада</span>
    <video id="video" autoplay playsinline muted></video>
    <div class="reticle"></div>
  </div>

  <div class="panel">
    <div class="result-card" id="resultCard">
      <div class="status-text">Наведите прицел на деталь и нажмите «Распознать»</div>
    </div>

    <div class="controls">
      <button id="scanBtn">📷 Распознать</button>
      <button id="autoBtn">🔄 Авто: ВЫКЛ</button>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const EDGE_FUNCTION_URL = "https://zpjmccnrfarkmmzvzbfj.supabase.co/functions/v1/telegram-bot";
    const IS_CLIENT_MODE = new URLSearchParams(window.location.search).get("mode") === "client";

    const modeBadge = document.getElementById("modeBadge");
    if (IS_CLIENT_MODE && modeBadge) {
      modeBadge.textContent = "Поиск по каталогу";
      modeBadge.style.background = "rgba(10, 132, 255, 0.92)";
      modeBadge.style.color = "#fff";
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const resultCard = document.getElementById("resultCard");
    const scanBtn = document.getElementById("scanBtn");
    const autoBtn = document.getElementById("autoBtn");

    let isScanning = false;
    let autoTimer = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" }, 
            width: { ideal: 1280 }, 
            height: { ideal: 720 } 
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ 
            video: true, 
            audio: false 
          });
          video.srcObject = fallbackStream;
          await video.play();
        } catch (e) {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка доступа к камере: ${e.message}</div>`;
        }
      }
    }

    function captureCenterCrop() {
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) return null;

      const cropSize = Math.min(vw, vh) * 0.65;
      const sx = (vw - cropSize) / 2;
      const sy = (vh - cropSize) / 2;

      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 512, 512);

      return canvas.toDataURL("image/jpeg", 0.82);
    }

    function resolveUserId() {
      const fromTg = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      const fromUrl = new URLSearchParams(window.location.search).get("uid");
      const candidate = fromTg || fromUrl;

      if (candidate && candidate !== "undefined" && candidate !== "null") {
        try {
          localStorage.setItem("lego_scanner_uid", String(candidate));
        } catch (e) {}
        return String(candidate);
      }

      try {
        const saved = localStorage.getItem("lego_scanner_uid");
        if (saved && saved !== "undefined" && saved !== "null") {
          return saved;
        }
      } catch (e) {}

      return null;
    }

    let userId = resolveUserId();
    let wasAutoPaused = false;

    function pauseAutoForChoice() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        wasAutoPaused = true;
        autoBtn.classList.remove("active");
        autoBtn.textContent = "⏸ Пауза (выбор)";
      }
    }

    function resumeAutoIfNeeded() {
      if (wasAutoPaused) {
        wasAutoPaused = false;
        autoBtn.classList.add("active");
        autoBtn.textContent = "🟢 Авто: ВКЛ";
        autoTimer = setInterval(scanFrame, 2500);
      }
    }

    function renderAddedCard(data) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      }
      resultCard.innerHTML = `
        <div class="part-num">🔢 ${data.part_number} <span style="color:#30d158;">(+1 шт)</span></div>
        <div class="part-name">🧩 ${data.part_name}</div>
        <div class="part-color">🎨 Цвет: ${data.color_name}</div>
        <div class="part-stock" style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c; font-size: 15px; color: #30d158; font-weight: 700;">
          📦 ${data.location}: ${data.new_stock} шт (${data.price} ₽)
        </div>
        <button onclick="undoScan(this, ${data.row_num})" style="margin-top: 10px; width: 100%; background: #ff453a; color: white; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none;">
          ❌ Ошибка (Отменить +1)
        </button>
      `;
    }

    function renderClientCard(data) {
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred("success");
      }

      const items = Array.isArray(data.items) ? data.items : [];
      let stockBlockHtml = "";

      if (items.length === 0) {
        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c; font-size: 14px; color: #ff453a; font-weight: 600;">
            🔴 Нет в наличии в каталоге склада
          </div>
        `;
      } else if (items.length === 1) {
        const it = items[0];
        const inStock = it.stock > 0;
        const stockColor = inStock ? "#30d158" : "#ff453a";
        const stockLabel = inStock ? `В наличии: ${it.stock} шт.` : "Нет в наличии (0 шт.)";
        const commentHtml = it.comment
          ? `<div style="font-size: 12px; color: #d1d1d6; margin-top: 4px;">💬 ${it.comment}</div>`
          : "";

        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c;">
            <div style="font-size: 16px; font-weight: 800; color: #ffd60a;">
              💰 ${it.price} ₽ <span style="color: ${stockColor}; font-size: 14px; font-weight: 700;">• ${stockLabel}</span>
            </div>
            ${commentHtml}
          </div>
        `;
      } else {
        const rowsHtml = items.map(it => {
          const inStock = it.stock > 0;
          const stockColor = inStock ? "#30d158" : "#ff453a";
          const stockLabel = inStock ? `${it.stock} шт.` : "0 шт.";
          const commentBadge = it.comment ? ` • 💬 ${it.comment}` : "";
          return `
            <div style="background: #3a3a3c; padding: 8px 10px; border-radius: 8px; margin-top: 6px; font-size: 13px;">
              <span style="font-weight: 800; color: #ffd60a;">💰 ${it.price} ₽</span>
              <span style="color: ${stockColor}; font-weight: 700;"> • 📦 ${stockLabel}</span>
              <span style="color: #d1d1d6; font-size: 12px;">${commentBadge}</span>
            </div>
          `;
        }).join("");

        stockBlockHtml = `
          <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #3a3a3c;">
            <div style="font-size: 12px; color: #8e8e93;">Найдено позиций: ${items.length}</div>
            ${rowsHtml}
          </div>
        `;
      }

      resultCard.innerHTML = `
        <div class="part-num">🔢 ${data.part_number}</div>
        <div class="part-name">🧩 ${data.part_name}</div>
        <div class="part-color">🎨 Цвет: ${data.color_name}</div>
        ${stockBlockHtml}
      `;
    }

    async function scanFrame() {
      if (isScanning || wasAutoPaused) return;
      const base64Image = captureCenterCrop();
      if (!base64Image) return;

      userId = resolveUserId();
      if (!userId && !IS_CLIENT_MODE) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка: Не получен ID Telegram. Откройте сканер через бота.</div>`;
        return;
      }

      isScanning = true;
      scanBtn.disabled = true;
      scanBtn.textContent = "⏳ Распознаю...";

      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "live_scan_add",
            image_base64: base64Image,
            user_id: userId || "guest",
            mode: IS_CLIENT_MODE ? "client" : "admin"
          })
        });

        const data = await res.json();

        if (data.success && data.mode === "client_info") {
          renderClientCard(data);
        } else if (data.success && data.mode === "choose") {
          pauseAutoForChoice();
          if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.notificationOccurred("warning");
          }

          const buttonsHtml = data.variants.map(v => {
            const commentBadge = v.comment ? ` • 💬 ${v.comment}` : " • Без пометки";
            return `
              <button onclick="confirmVariant(${v.row_num})" style="width: 100%; text-align: left; background: #3a3a3c; color: #fff; padding: 10px 12px; border-radius: 8px; margin-top: 6px; font-size: 13px; border: 1px solid #545458;">
                <div style="font-weight: 700; color: #ffd60a;">➕ ${v.price} ₽ (остаток: ${v.stock} шт.)</div>
                <div style="color: #d1d1d6; font-size: 12px; margin-top: 2px;">Строка №${v.row_num}${commentBadge}</div>
              </button>
            `;
          }).join("");

          resultCard.innerHTML = `
            <div style="background: rgba(255, 159, 10, 0.15); border: 1px solid #ff9f0a; border-radius: 10px; padding: 10px;">
              <div style="font-weight: 800; color: #ff9f0a; font-size: 14px;">⚠️ Найдено несколько вариантов (${data.part_number})</div>
              <div style="font-size: 12px; color: #e5e5ea; margin-top: 2px;">Выберите нужную строку для добавления +1 шт.:</div>
              ${buttonsHtml}
              <button onclick="cancelChoice()" style="width: 100%; background: transparent; color: #8e8e93; padding: 6px; margin-top: 6px; font-size: 12px; border: none;">
                Пропустить деталь
              </button>
            </div>
          `;
        } else if (data.success && data.mode === "added") {
          renderAddedCard(data);
        } else {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">🤷‍♂️ ${data.error || "Не удалось распознать"}</div>`;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
      } finally {
        isScanning = false;
        scanBtn.disabled = false;
        scanBtn.textContent = "📷 Распознать";
      }
    }

    async function confirmVariant(rowNum) {
      resultCard.innerHTML = `<div class="status-text">⏳ Записываю +1 шт. в строку №${rowNum}...</div>`;
      try {
        const res = await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "live_scan_confirm_row",
            row_num: rowNum
          })
        });
        const data = await res.json();
        if (data.success) {
          renderAddedCard(data);
          resumeAutoIfNeeded();
        } else {
          resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">❌ ${data.error}</div>`;
        }
      } catch (err) {
        resultCard.innerHTML = `<div class="status-text" style="color:#ff453a;">Ошибка сети: ${err.message}</div>`;
      }
    }

    function cancelChoice() {
      resultCard.innerHTML = `<div class="status-text">Деталь пропущена. Сканируйте дальше.</div>`;
      resumeAutoIfNeeded();
    }

    async function undoScan(btn, rowNum) {
      btn.disabled = true;
      btn.textContent = "⏳ Отменяю...";
      try {
        await fetch(EDGE_FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "live_scan_undo", row_num: rowNum })
        });
        resultCard.innerHTML = `<div class="status-text" style="color:#ff9f0a;">↩️ Добавление отменено (-1 шт.).</div>`;
      } catch (err) {
        btn.textContent = "❌ Ошибка отмены";
      }
    }

    scanBtn.addEventListener("click", () => {
      wasAutoPaused = false;
      scanFrame();
    });

    autoBtn.addEventListener("click", () => {
      wasAutoPaused = false;
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.classList.remove("active");
        autoBtn.textContent = "🔄 Авто: ВЫКЛ";
      } else {
        autoBtn.classList.add("active");
        autoBtn.textContent = "🟢 Авто: ВКЛ";
        scanFrame();
        autoTimer = setInterval(scanFrame, 2500);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        wasAutoPaused = false;
        autoBtn.classList.remove("active");
        autoBtn.textContent = "🔄 Авто: ВЫКЛ";
      }
    });

    startCamera();
  </script>
</body>
</html>
